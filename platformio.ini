[platformio]
src_dir = esp32_marauder
test_dir = test

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = true
extra_scripts =
  pre:tools/native_coverage.py
build_src_filter =
  -<*>
  +<MarauderMacAddress.cpp>
  +<PcapHeader.cpp>
  +<Switches.cpp>
  +<DisplayLine.cpp>
  +<BeaconFrame.cpp>
  +<WdgResponse.cpp>
  +<FoxHuntTarget.cpp>
  +<TargetListSort.cpp>
  +<TDongleStats.cpp>
  +<IPv4Range.cpp>
  +<FirmwareMetadata.cpp>
  +<MenuMarquee.cpp>
  +<GpsTrackerStats.cpp>
  +<BootSplash.cpp>
  +<MenuInputRepeat.cpp>
  +<TDongleBus.cpp>
  +<RemoteIdModel.cpp>
  +<RemoteIdDecoder.cpp>
  +<MemoryGuard.cpp>
  +<CsiMotionModel.cpp>
  +<CensorText.cpp>
  +<StationSelection.cpp>
  +<StickyModel.cpp>
  +<M5PaperModel.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
  --coverage
  -Itest/support

; Reproducible hardware build, independent of global Arduino libraries.
[env:sticky_native]
extends = env:native
build_src_filter =
  -<*>
  +<StickyModel.cpp>
test_filter = test_sticky_model

[env:reterminal_sticky]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_upload.flash_size = 32MB
board_build.partitions = installer/partitions/reterminal_sticky.csv
build_flags =
  -DMARAUDER_RETERMINAL_STICKY
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
  -Wl,-zmuldefs
build_unflags = -fexceptions
lib_deps =
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit BusIO@1.15.0
  https://github.com/bblanchon/ArduinoJson.git#v6.18.2
  h2zero/NimBLE-Arduino@2.3.8
  https://github.com/ivanseidel/LinkedList.git#v1.3.3
  ESP32Async/AsyncTCP@3.4.8
  ESP32Async/ESPAsyncWebServer@3.8.1
  https://github.com/marian-craciunescu/ESP32Ping.git#1.6
  stevemarple/MicroNMEA@2.0.6
  plerup/EspSoftwareSerial@8.1.0
monitor_speed = 115200
upload_speed = 921600

[env:m5paper_v11]
; Match upstream Marauder's classic ESP32 toolchain. IDF 5.5.5 exceeds the
; classic chip's IRAM budget with Wi-Fi, Bluetooth and PSRAM enabled together.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.partitions = installer/partitions/m5paper_v11.csv
extra_scripts =
  post:tools/m5paper_link.py
  post:tools/m5paper_factory.py
build_flags =
  -DMARAUDER_M5PAPER
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=0
  -Wl,-zmuldefs
build_unflags = -fexceptions
lib_deps =
  ${env:reterminal_sticky.lib_deps}
  https://github.com/m5stack/M5GFX.git#65c816a38386062d2c3dc47d41237a9083acbc75
monitor_speed = 115200
upload_speed = 921600

[env:m5paper_native]
extends = env:sticky_native
build_src_filter =
  -<*>
  +<StickyModel.cpp>
  +<M5PaperModel.cpp>
test_filter = test_m5paper_model
