[platformio]
src_dir = esp32_marauder
test_dir = test

[env:native]
platform = native@1.2.1
test_ignore = test_xiao_switches
test_framework = unity
test_build_src = true
extra_scripts =
  pre:tools/native_coverage.py
build_src_filter =
  -<*>
  +<MarauderMacAddress.cpp>
  +<PcapHeader.cpp>
  +<Switches.cpp>
  +<DisplayLine.cpp>
  +<BeaconFrame.cpp>
  +<WdgResponse.cpp>
  +<FoxHuntTarget.cpp>
  +<TargetListSort.cpp>
  +<TDongleStats.cpp>
  +<IPv4Range.cpp>
  +<FirmwareMetadata.cpp>
  +<MenuMarquee.cpp>
  +<GpsTrackerStats.cpp>
  +<BootSplash.cpp>
  +<MenuInputRepeat.cpp>
  +<TDongleBus.cpp>
  +<RemoteIdModel.cpp>
  +<RemoteIdDecoder.cpp>
  +<MemoryGuard.cpp>
  +<CsiMotionModel.cpp>
  +<CensorText.cpp>
  +<StationSelection.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
  --coverage
  -Itest/support

; Exercise the new target's debounce separately from existing immediate inputs.
[env:native_xiao]
extends = env:native
test_filter = test_xiao_switches
test_ignore =
build_flags =
  ${env:native.build_flags}
  -DXIAO_ESP32_S3_TOUCH
