name: M5Paper v1.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pioarduino==6.2.0
      - name: Test display and touch model
        run: .venv/bin/pio test -e m5paper_native
      - name: Build firmware
        run: .venv/bin/pio run -e m5paper_v11 -t factory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marauder-m5paper-v11
          if-no-files-found: error
          path: |
            .pio/build/m5paper_v11/firmware.bin
            .pio/build/m5paper_v11/firmware.factory.bin
            docs/m5paper-v11.md
