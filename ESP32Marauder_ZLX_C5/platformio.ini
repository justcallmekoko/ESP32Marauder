; ESP32 Marauder v1.16.0 — ZLX ESP32-C5 2.8" ST7789 BGR one-click package
; Board: ESP32-C5-WROOM-1U-N8R8 + ST7789 240x320 + XPT2046 + SD + GPS
;
;   pio run -e zlx_c5
;   pio run -e zlx_c5 -t upload
;   pio device monitor -b 115200

[platformio]
default_envs = zlx_c5
src_dir = esp32_marauder
boards_dir = boards

[env:zlx_c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-n8r8
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = time, colorize

board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qio
board_build.partitions = default_8MB.csv
board_build.filesystem = spiffs

extra_scripts =
    pre:scripts/clean_bad_sd.py
    pre:scripts/patch_tft_espi_c5.py
    pre:scripts/fix_network_include.py

build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Werror=return-type

build_flags =
    -Wno-error=return-type
    -Wl,--allow-multiple-definition
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DMARAUDER_ZLX_C5
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=2
    -DTFT_MOSI=7
    -DTFT_SCLK=6
    -DTFT_CS=10
    -DTFT_DC=14
    -DTFT_RST=-1
    -DTFT_BL=13
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DUSE_FSPI_PORT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1


lib_ldf_mode = chain
lib_compat_mode = soft

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    h2zero/NimBLE-Arduino @ ^2.5.0
    bblanchon/ArduinoJson @ 6.21.5
    stevemarple/MicroNMEA @ ^2.0.6
    ivanseidel/LinkedList
    marian-craciunescu/ESP32Ping
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
